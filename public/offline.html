<!doctype html>
<html lang="pt-AO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10B981" />
    <title>Webstart sem ligação</title>
    <style>
      :root {
        color: #064e3b;
        background: #f8fffb;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }
      main {
        width: min(90vw, 28rem);
        border: 3px solid #065f46;
        box-shadow: 6px 6px 0 #064e3b;
        background: white;
        padding: 2rem;
        text-align: center;
      }
      img {
        width: 5rem;
        height: 5rem;
        margin-bottom: 1rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #1f2937;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-192.svg" alt="Webstart" />
      <h1>Estás sem ligação</h1>
      <p>
        Volta a ligar-te à internet para continuar. As páginas já visitadas
        estarão disponíveis quando a ligação regressar.
      </p>
    </main>
  </body>
</html>
